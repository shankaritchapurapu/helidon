oci:
  limits:
    auth:
      authentication-method: service-principal
    client:
      connection-timeout: PT5S
      read-timeout: PT30S
      max-async-threads: 20

# For local or test runs with explicit service-principal certificates, configure the
# Limits auth override inline:
