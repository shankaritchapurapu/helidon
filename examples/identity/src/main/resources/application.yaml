server:
  port: 8080
  host: 0.0.0.0
  features:
    request-scope:
      enabled: true
  # Configure a dedicated listener for SPLAT traffic. This listener should be
  # mTLS-only so Helidon exposes the SPLAT client certificate chain to the Auth
  # SDK SPLAT-aware filter.
  #
  # sockets:
  #   splat:
  #     port: 8443
  #     tls:
  #       client-auth: "REQUIRED"
  #       endpoint-identification-algorithm: "NONE"
  #       trust:
  #         pem:
  #           cert-chain:
  #             resource.path: /path/to/trusted-client-ca.pem
  #       private-key:
  #         pem:
  #           key:
  #             resource.path: /path/to/server-key.pem
  #           cert-chain:
  #             resource.path: /path/to/server-cert-chain.pem

declarative:
  ignore-incubating: true

oci:
  identity:
    authentication:
      global-business-unit: my-business-unit
      team-name: my-team
      application-name: my-application
      instance-principal-uri: http://localhost:8000
      root-cert-path: /etc/oci-pki/ca-bundle.pem
    authorization:
      service-name: my-service
      root-cert-path: /etc/oci-pki/ca-bundle.pem
    splat-aware:
      # This should match the dedicated mTLS SPLAT listener above.
      splat-request-port: 8443
      additional-splat-request-ports: []
      skip-authorization-for-splat: true
      validate-splat-cert: true
      disable-tag-only-request-check: true
      reject-x-region-calls: false
