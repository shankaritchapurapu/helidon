server:
  port: 8080
  host: 127.0.0.1
  features:
    request-scope:
      enabled: true

declarative:
  ignore-incubating: true

oci:
  identity:
    authentication:
      global-business-unit: my-business-unit
      team-name: my-team
      application-name: my-application
      root-cert-path: src/test/resources/serverCert.pem
    authorization:
      service-name: my-service
      root-cert-path: src/test/resources/serverCert.pem
    splat-aware:
      splat-request-port: 8080
      additional-splat-request-ports: []
      skip-authorization-for-splat: true
      validate-splat-cert: false
      disable-tag-only-request-check: true
      reject-x-region-calls: false
