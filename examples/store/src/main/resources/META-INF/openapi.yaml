openapi: 3.0.3
info:
  title: Helidon Store Example API
  version: "1.0.0"
  description: >
    OpenAPI description for the Helidon OCI Kiev store example. The example
    exposes plain-text endpoints for storing, retrieving, and listing items,
    and JSON endpoints for reading Kiev stream records.
servers:
  - url: /
paths:
  /store/items:
    get:
      summary: List stored items
      operationId: listStoreItems
      parameters:
        - name: pageSize
          in: query
          description: Number of items to return in one page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: pageToken
          in: query
          description: Token returned by a previous page to continue iteration.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Current page of items as plain text
          content:
            text/plain:
              schema:
                type: string
              example: |-
                alpha=one
                beta=two
                next-page-token=YmV0YQ
        "400":
          description: Invalid pagination request
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidPageSize:
                  value: pageSize must be an integer
                invalidPageToken:
                  value: Invalid page token
    post:
      summary: Store an item from a key=value body
      operationId: postStoreItem
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: alpha=one
      responses:
        "200":
          description: Stored item echoed back as plain text
          content:
            text/plain:
              schema:
                type: string
              example: alpha=one
        "400":
          description: Request body is invalid
          content:
            text/plain:
              schema:
                type: string
              example: Request body must use key=value format
        "409":
          description: Item already exists
          content:
            text/plain:
              schema:
                type: string
              example: Unable to store item
  /store/items/{key}:
    put:
      summary: Update an existing item
      operationId: putStoreItem
      parameters:
        - name: key
          in: path
          description: Item key to store.
          required: true
          schema:
            type: string
          example: alpha
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: one
      responses:
        "200":
          description: Updated item echoed back as plain text
          content:
            text/plain:
              schema:
                type: string
              example: alpha=one
        "400":
          description: Request body is invalid
          content:
            text/plain:
              schema:
                type: string
              example: Request must contain a value
        "404":
          description: Item was not found
          content:
            text/plain:
              schema:
                type: string
              example: "No value found for key: alpha"
        "409":
          description: Item could not be updated
          content:
            text/plain:
              schema:
                type: string
              example: Unable to update item
    get:
      summary: Retrieve one item by key
      operationId: getStoreItem
      parameters:
        - name: key
          in: path
          description: Item key to retrieve.
          required: true
          schema:
            type: string
          example: alpha
      responses:
        "200":
          description: Stored value as plain text
          content:
            text/plain:
              schema:
                type: string
              example: one
        "404":
          description: Item was not found
          content:
            text/plain:
              schema:
                type: string
              example: "No value found for key: alpha"
    delete:
      summary: Delete one item by key
      operationId: deleteStoreItem
      parameters:
        - name: key
          in: path
          description: Item key to delete.
          required: true
          schema:
            type: string
          example: alpha
      responses:
        "200":
          description: Deleted key echoed back as plain text
          content:
            text/plain:
              schema:
                type: string
              example: alpha
        "404":
          description: Item was not found
          content:
            text/plain:
              schema:
                type: string
              example: "No value found for key: alpha"
  /store/stream:
    get:
      summary: Read Kiev stream records for store items
      operationId: getStoreStreamRecords
      parameters:
        - name: cursor
          in: query
          description: Cursor returned by /store/stream/cursors or a previous stream request.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Number of stream records to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Page of Kiev stream records for the store item bucket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStreamPage"
        "400":
          description: Invalid stream request
          content:
            text/plain:
              schema:
                type: string
              example: limit must be an integer
        "404":
          description: Kiev stream client is not available for the configured backend
          content:
            text/plain:
              schema:
                type: string
              example: Kiev streams require the store example to use the SERVICE backend
  /store/stream/cursors:
    get:
      summary: Read Kiev stream cursors
      operationId: getStoreStreamCursors
      responses:
        "200":
          description: Oldest and newest Kiev stream cursors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStreamCursors"
        "404":
          description: Kiev stream client is not available for the configured backend
          content:
            text/plain:
              schema:
                type: string
              example: Kiev streams require the store example to use the SERVICE backend
components:
  schemas:
    StoreStreamCursors:
      type: object
      properties:
        oldest:
          type: string
          description: Oldest available stream cursor.
        newest:
          type: string
          description: Newest available stream cursor.
      required:
        - oldest
        - newest
    StoreStreamPage:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/StoreStreamRecord"
        nextCursor:
          type: string
          description: Cursor to request the next page.
        secondsFromTip:
          type: integer
          format: int64
          description: Stream lag in seconds.
      required:
        - records
        - nextCursor
        - secondsFromTip
    StoreStreamRecord:
      type: object
      properties:
        recordType:
          type: string
          description: Kiev stream record type.
          enum:
            - TX_COMMIT
            - SCHEMA_UPDATE
        beginTxId:
          type: integer
          format: int64
          description: Begin transaction id.
        commitTxId:
          type: integer
          format: int64
          description: Commit transaction id.
        commitTime:
          type: string
          format: date-time
          description: Commit time.
        contents:
          type: array
          items:
            $ref: "#/components/schemas/StoreStreamContent"
      required:
        - recordType
        - beginTxId
        - commitTxId
        - commitTime
        - contents
    StoreStreamContent:
      type: object
      properties:
        bucketName:
          type: string
          description: Kiev bucket name. This example returns only store_example_items content.
        mutationType:
          type: string
          description: Mutation type.
          enum:
            - UPSERT
            - DELETE
        keys:
          type: object
          description: Mutation key columns.
          additionalProperties: true
        values:
          type: object
          description: Mutation value columns.
          additionalProperties: true
      required:
        - bucketName
        - mutationType
        - keys
        - values
