server:
  port: 8080
  host: 0.0.0.0
  features:
    oci-error-code:
      enabled: true

declarative:
  ignore-incubating: true

oci:
  kiev:
    data-stores:
      - backend: "IN_MEMORY"
        store-name: helidon-data-plane-example
        app-name: helidon-data-plane-example
        transaction-max-reads: 1000
        transaction-max-writes: 100
  identity:
    authentication:
      global-business-unit: my-business-unit
      team-name: my-team
      application-name: helidon-data-plane-example
      instance-principal-uri: http://localhost:8000
      root-cert-path: /etc/oci-pki/ca-bundle.pem
      hard-coded-key-supplier: ${helidon.oci.hardCodedKeySupplier}
    authorization:
      service-name: helidon-data-plane-example
      root-cert-path: /etc/oci-pki/ca-bundle.pem
  auditv2:
    enabled: true
    event-source: helidon-data-plane-example
    request-parameter-rules:
      - resources: /data-plane/robots
        actions: GET
        values: displayName
      - resources: /data-plane/robots
        actions: GET
        values: compartmentId
    request-header-rules:
      - resources: /data-plane/robots.*
        actions: POST|PUT|DELETE
        values: opc-request-id
    response-header-rules:
      - resources: /data-plane.*
        actions: GET|POST|PUT|DELETE
        values: opc-request-id

# To persist robots in Oracle DB instead of the in-memory Kiev backend:
# oci:
#   kiev:
#     data-stores:
#       - backend: "DIRECT_DB"
#         store-name: helidon-data-plane-example
#         app-name: helidon-data-plane-example
#         transaction-max-reads: 1000
#         transaction-max-writes: 100
#         direct-db:
#           jdbc-url: jdbc:oracle:thin:@//localhost:1521/pdbdev
#           user-name: helidon
#           password: changeit
#           schema-name: helidon

# To use Kiev as a service instead:
# oci:
#   kiev:
#     data-stores:
#       - backend: "SERVICE"
#         store-name: helidon-data-plane-example
#         app-name: helidon-data-plane-example
#         service:
#           compartment-id: ocid1.compartment.oc1...
#           frontend-endpoint: https://your-kiev-endpoint
#           locality: "REGIONAL"
#           auth:
#             type: "INSTANCE"
#             tls:
#               root-cert-pem-path: /etc/oci-pki/ca-bundle.pem

# Optional examples for configuration-oriented integrations:
