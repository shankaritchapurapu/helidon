# For more information about configuring ocibuild.conf follow https://confluence.oci.oraclecorp.com/display/BLD/Build+Service+ocibuild.conf+Reference+Guide

runnerTag: latest

name: oci-helidon
team: Helidon
phoneBookId: helidon
description: Helidon integration modules for internal OCI services

majorversion: 0
minorversion: 1
shortversion: ${majorversion}.${minorversion}
snapshotVersion: ${shortversion}-SNAPSHOT
version: ${shortversion}${?BLD_BRANCH_SUFFIX}.${BLD_NUMBER}

triggerOnCommitBranches: ["helidon-2.x", "pull-requests"]
releaseBranches: ["helidon-2.x"]
initialBuildNumber: {
  "helidon-2.x" : 1
  "*" : 1
}

releaseArtifactoryRepo: weblogic-management-service-release-maven-local
snapshotArtifactoryRepo: weblogic-management-service-snapshot-maven-local

# from https://confluence.oci.oraclecorp.com/pages/viewpage.action?spaceKey=BLD&title=Build+Service+AuthZ+for+teams+without+tenancy
#helidon:
authCompartmentOcid: "ocid1.compartment.oc1..aaaaaaaabkst6bl3wn5qtatfzkzghw5z5grzapbgmsfcercnagfrntw3d5pq"

steps:
    [
        {
            name: compilesource
            type: maven
            runnerImage: build-runner-maven-graalvm22-jdk11
            javaVersion: jdk-11
            mavenCommands: [
                { goal: "validate", args: "--global-toolchains build_config/toolchains.xml -N -DrequireVersion="${snapshotVersion} },
                { goal: "versions:set", args: "--global-toolchains build_config/toolchains.xml -DnewVersion="${version}" -DprocessAllModules=true"},
                { goal: "versions:set-property", args: "--global-toolchains build_config/toolchains.xml -DnewVersion="${version}" -DprocessAllModules=true -Dproperty=helidon.oci.version"},
                { goal: "install", args: "--global-toolchains build_config/toolchains.xml"}
            ]
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_oci_helidon_maven_artifacts
            type: publishmaven
            dependsOn: compilesource
            pomLocation: .
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
        },
        {
            name: publish_maven_artifacts_repackaged_oci
            type: publishmaven
            dependsOn: publish_oci_helidon_maven_artifacts
            pomLocation: repackaged-oci
            multiModuleDeploy: true
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
        },
        {
            name: publish_maven_artifacts_oci_error_code
            type: publishmaven
            dependsOn: compilesource
            pomLocation: oci-error-code
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },
        {
          name: publish_maven_artifacts_oci_identity
          type: publishmaven
          dependsOn: compilesource
          pomLocation: oci-identity
          repository: ${releaseArtifactoryRepo}
          snapshotRepository: ${snapshotArtifactoryRepo}
          artifacts: [
            "**"
          ]
        },
        {
          name: publish_maven_artifacts_oci_request_id
          type: publishmaven
          dependsOn: compilesource
          pomLocation: oci-request-id
          repository: ${releaseArtifactoryRepo}
          snapshotRepository: ${snapshotArtifactoryRepo}
          artifacts: [
            "**"
          ]
        },
        {
            name: publish_maven_artifacts_oci_swagger_maven_plugin
            type: publishmaven
            dependsOn: compilesource
            pomLocation: oci-swagger-maven-plugin
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_maven_artifacts_bom
            type: publishmaven
            dependsOn: compilesource
            pomLocation: bom
            multiModuleDeploy: false
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_maven_artifacts_dependencies
            type: publishmaven
            dependsOn: publish_maven_artifacts_bom
            pomLocation: dependencies
            multiModuleDeploy: false
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_maven_artifacts_applications
            type: publishmaven
            dependsOn: publish_maven_artifacts_dependencies
            pomLocation: applications
            multiModuleDeploy: false
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_maven_artifacts_applications_mp
            type: publishmaven
            dependsOn: publish_maven_artifacts_applications
            pomLocation: applications/mp
            multiModuleDeploy: false
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
        },
        {
            name: publish_maven_artifacts_applications_se
            type: publishmaven
            dependsOn: publish_maven_artifacts_applications
            pomLocation: applications/se
            multiModuleDeploy: false
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
        },
    ]
