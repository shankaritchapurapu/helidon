# For more information about configuring ocibuild.conf follow https://confluence.oci.oraclecorp.com/display/BLD/Build+Service+ocibuild.conf+Reference+Guide

runnerTag: latest

name: oci-helidon
team: Helidon
phoneBookId: helidon
description: Helidon integration modules for internal OCI services

majorversion: 0
minorversion: 1
shortversion: ${majorversion}.${minorversion}
snapshotVersion: ${shortversion}-SNAPSHOT
version: ${shortversion}${?BLD_BRANCH_SUFFIX}.${BLD_NUMBER}

triggerOnCommitBranches: ["helidon-2.x", "pull-requests", "test-publish"]
releaseBranches: ["helidon-2.x", "test-publish"]
initialBuildNumber: {
  "helidon-2.x" : 1
  "*" : 1
}

releaseArtifactoryRepo: build-service-test-maven-local
snapshotArtifactoryRepo: build-service-test-maven-local

# from https://confluence.oci.oraclecorp.com/pages/viewpage.action?spaceKey=BLD&title=Build+Service+AuthZ+for+teams+without+tenancy
#helidon:
authCompartmentOcid: "ocid1.compartment.oc1..aaaaaaaabkst6bl3wn5qtatfzkzghw5z5grzapbgmsfcercnagfrntw3d5pq"

steps:
    [
        {
            name: compilesource
            type: maven
            runnerImage: build-runner-maven-graalvm22-jdk11
            javaVersion: jdk-11
            mavenCommands: [
                { goal: "validate", args: "--global-toolchains build_config/toolchains.xml -N -DrequireVersion="${snapshotVersion} },
                { goal: "versions:set", args: "--global-toolchains build_config/toolchains.xml -DnewVersion="${version}" -DprocessAllModules=true"},
                { goal: "install", args: "--global-toolchains build_config/toolchains.xml"}
            ]
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_oci_helidon_maven_artifacts
            type: publishmaven
            dependsOn: compilesource
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
        },
        {
            name: publish_maven_artifacts_repackaged_oci
            type: publishmaven
            dependsOn: publish_oci_helidon_maven_artifacts
            pomLocation: repackaged-oci
            multiModuleDeploy: true
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_maven_artifacts_oci_error_code
            type: publishmaven
            dependsOn: publish_oci_helidon_maven_artifacts
            pomLocation: oci-error-code
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },
        {
            name: publish_maven_artifacts_oci_request_id
            type: publishmaven
            dependsOn: publish_oci_helidon_maven_artifacts
            pomLocation: oci-request-id
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            artifacts: [
                "**"
            ]
        },

    ]