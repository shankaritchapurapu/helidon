# For more information about configuring ocibuild.conf follow https://confluence.oci.oraclecorp.com/display/BLD/Build+Service+ocibuild.conf+Reference+Guide

runnerTag: latest

name: oci-helidon
team: Helidon
phoneBookId: helidon
description: Helidon integration modules for internal OCI services

# Our approach to releases:
#  Merges to main produce SNAPSHOT builds
#  Merges to release-* produce release builds
#  We manage version numbers explicitly and do not rely on magically populated build service variables.

# Branches that publish artifacts.
# main publishes SNAPSHOT artifacts and does not create a source tag
# release-*  publishes release artifacts and creates a source tag
releaseBranches: ["main", "release-*"]
snapshotBranches: ["main"]
triggerOnCommitBranches: ["main", "pull-requests", "release-*"]

# By default we are producing SNAPSHOT builds
# TODO: For releases set to released version
version: 2.0.0-SNAPSHOT
#version: 1.2.1

# By default we don't create a tag, but do it for releases
# TODO: For releases set enabled to true
bitbucketTag: {"enabled": false, "tagName": ${version}, "description": "Release Tag"}

releaseArtifactoryRepo: helidon-oci-release-maven-local
snapshotArtifactoryRepo: helidon-oci-snapshot-maven-local

# see https://confluence.oci.oraclecorp.com/pages/viewpage.action?spaceKey=BLD&title=Build+Service+AuthZ+Onboarding
# helidon compartment from helidonocidev tenancy
authCompartmentOcid: "ocid1.compartment.oc1..aaaaaaaaiwoctrgf6w6rtq7az62fabscwgzbax2iepwu2qlub5qzcvabn5wa"

pipelineId: ocid1.devopsbuildpipeline.oc1.phx.aaaaaaaafdayzlbzrdzbvlrruc2wpicfccjglalxktbbxuckqcbs54gs6mya
slackChannels: ["#oci-helidon-pipeline"]

# This will make .git directory available in all steps in their builds.
# Its need by our helidon enforcer plugin esp. for copyright
enableGit: true

# Cache maven artifacts for re-use across builds (and, apparently, across steps).
# https://confluence.oci.oraclecorp.com/display/BLD/User+Guide+for+caching+3PLs+during+Builds
useCache: true

dockerReleaseRepo: odo-docker-signed-local
dockerImageName: ${name}"-integration-tests"
dockerImageVersion: ${version}${?BLD_BRANCH_SUFFIX}.${BLD_NUMBER}
# Export variables from pipeline build stage to other pipeline stages
exportVariables = {
    DOCKER_IMAGE_NAME = ${dockerImageName}
    DOCKER_IMAGE_VERSION = ${dockerImageVersion}
}

steps:
    [
        {
            name: compilesource
            type: maven
            javaVersion: jdk-25
            mavenCommands: [
                { goal: "install", args: "-e -B --global-toolchains build_config/toolchains.xml"}
            ]
            artifacts: [
                "**"
            ]
        },
        {
          name: checkstyle
          type: maven
          dependsOn: compilesource
          javaVersion: jdk-25
          mavenCommands: [
            {goal: "validate", args: "-B -Pcheckstyle --global-toolchains build_config/toolchains.xml"}
          ]
        },
        {
          name: spotbugs
          type: maven
          dependsOn: compilesource
          javaVersion: jdk-25
          mavenCommands: [
            { goal: "validate", args: "-B -Pspotbugs --global-toolchains build_config/toolchains.xml"}
          ]
        },
        {
          name: copyright
          type: maven
          dependsOn: compilesource
          javaVersion: jdk-25
          mavenCommands: [
            { goal: "validate", args: "-B -Pcopyright --global-toolchains build_config/toolchains.xml"}
          ]
        },
        {
            # The root POM imports this BOM, but publishmaven's module graph does not
            # order inherited import dependencies. Publish it before the parallel pass.
            name: publish_oci_helidon_internal_bom
            type: publishmaven
            dependsOn: compilesource
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            pomLocation: helidon-oci-internal-bom
        },
        {
            name: publish_oci_helidon_maven_artifacts_pass1
            type: publishmaven
            dependsOn: publish_oci_helidon_internal_bom
            repository: ${releaseArtifactoryRepo}
            snapshotRepository: ${snapshotArtifactoryRepo}
            multiModuleDeploy: true
            environment: {"MAVEN_ARGS": "-DskipApplications=true"}
            artifacts: [
              "**"
            ]
        },
        {
          name: publish_oci_helidon_maven_artifacts_pass2
          type: publishmaven
          dependsOn:publish_oci_helidon_maven_artifacts_pass1
          repository: ${releaseArtifactoryRepo}
          snapshotRepository: ${snapshotArtifactoryRepo}
          multiModuleDeploy: true
          pomLocation: applications
        },
        {
          name: dockerize_integration_test
          type: dockerizer
          platform: linux/arm64
          dockerFile: "Dockerfile"
          dockerBuildPwd: .
          dockerBuildArgs: { "progress": "plain" }
        },
        {
          name: publish_docker_integration_test
          type: publishdocker
          dependsOn: dockerize_integration_test
          repository: ${dockerReleaseRepo}
          imageVersion: ${dockerImageVersion}
          imageName: ${dockerImageName}
          skipOnDryRun: false
        }
    ]
