oci:
  identity:
    authentication:
      global-business-unit: "gbu"
      team-name: "team"
      application-name: "app"
      root-cert-path: "src/test/resources/serverCert.pem"
      use-instance-principal: false
      certificates:
        - certificate: "serverCert.pem"
          private-key: "serverKey.pem"
    authorization:
      enabled: false
      service-name: "service"
