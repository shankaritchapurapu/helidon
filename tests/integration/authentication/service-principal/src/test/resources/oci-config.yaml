helidon.oci:
  authentication-method: "service-principal"
  # allowed-authentication-methods: ["config", "config-file", "session-token", "resource-principal", "instance-principal", "service-principal", "oke-workload-identity"]
  imds-timeout: "PT3S" # 3 seconds timeout, may be slower when tunneling
  imds-base-uri: "http://169.254.169.254/opc/v2/" # Set to "http://localhost:8000/opc/v2/" when running locally via STTest profile else "http://169.254.169.254/opc/v2/"
  imds-detect-retries: 1
