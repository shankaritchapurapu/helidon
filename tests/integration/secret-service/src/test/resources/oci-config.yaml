helidon:
  oci:
    authentication-method: "instance-principal"
    imds-timeout: "PT3S"
    imds-base-uri: "http://169.254.169.254/opc/v2/"
    imds-detect-retries: 1

  oci-env:
    location-override:
      region: "us-phoenix-1"
      availability-domain: "phx-ad-1"
      fault-domain: 1

  oci-secret-service:
    prefix: "oci.ssv2"
    poll-interval: "PT30M"
