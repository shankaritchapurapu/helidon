swagger: "2.0"
info:
  version: 1.0.0
  title: Compute API
  description: API for the Compute Service
  contact:
    name: Compute
    email: opc_metadata_dev_grp@oracle.com
  license:
    name: Oracle Corporation
host: localhost:19000
basePath: /v1
schemes:
  - http
consumes:
  - application/json; charset=utf-8
produces:
  - application/json

x-obmcs-endpoint-template: 'https://robots-control-plane-api.{region}.oci.{secondLevelDomain}'

x-anchors:
  x-headers:
    opc-work-request-id: &ref-opc-work-request-id
      description: |
        Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.
      type: string
    opc-request-id: &ref-opc-request-id
      description: |
        Unique Oracle-assigned identifier for the request. If you need to contact
        Oracle about a particular request, please provide the request ID.
      type: string
    retry-after: &ref-retry-after
        type: number
        format: float
        description: A decimal number representing the number of seconds the client should wait before polling this endpoint again.

paths:
  /proxyFleets:
    get:
      operationId: ListProxyFleets
      description: |
        Gets all splat proxy fleet objects.
      parameters:
        - name: lifecycleState
          in: query
          type: string
          required: false
          x-obmcs-enumref: "#/definitions/ProxyFleetSummary/lifecycleState"
          description: |
            A filter to only return resources that match the given lifecycle state.
        - $ref: '#/parameters/ValidMinLength'
        - $ref: '#/parameters/ValidMaxLength'
        - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: a list of `ProxyFleet` objects
          headers:
            opc-request-id:
              type: string
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
            opc-next-page:
              type: string
              description: |
                For pagination of a list of items. When paging through a list, if this header appears in the response,
                then a partial list might have been returned. Include this value as the `page` parameter for the
                subsequent GET request to get the next batch of items.
          schema:
            items:
              $ref: '#/definitions/ProxyFleetSummary'
            type: array
        default:
          $ref: '#/responses/Error'
      summary: ListProxyFleets
      tags: [SplatRegistrar]

  /regions:
    get:
      tags: ['compute']
      description: |
        Get a list of regions. This is an example of a long comment
        that spans multiple lines. The third line
        starts here.
      operationId: ListRegions
      responses:
        200:
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/Region'
          headers:
            opc-next-page:
              type: string
              description: A pagination token to the start of the next page, if one exist.
            opc-previous-page:
              type: string
              description: A pagination token to the start of the previous page, if one exists
            opc-total-count:
              type: integer
              description: An approximate total number of resources.
            opc-limit:
              type: integer
              description: The limit that was actually applied to the result page.
        default:
          $ref: '#/responses/Error'

  /regions/{instance-id}:
    get:
      tags: ['compute']
      description: Get a region
      operationId: GetRegion
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
      responses:
        200:
          description: region response
          schema:
            $ref: '#/definitions/Region'
        default:
          $ref: '#/responses/Error'

  /regions/{instance-id}/domains:
    get:
      tags: ['compute']
      description: Get a list of availability domains for region
      operationId: ListAvailabilityDomains
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
      responses:
        200:
          description: Availability domains for a region
          schema:
            type: array
            items:
              $ref: '#/definitions/AvailabilityDomain'
          headers:
            opc-next-page:
              type: string
              description: A pagination token to the start of the next page, if one exist.
            opc-previous-page:
              type: string
              description: A pagination token to the start of the previous page, if one exists
            opc-total-count:
              type: integer
              description: An approximate total number of resources.
            opc-limit:
              type: integer
              description: The limit that was actually applied to the result page.
        default:
          $ref: '#/responses/Error'

  /instances:
    get:
      tags: ['compute']
      description: List all instances
      operationId: ListInstances
      responses:
        200:
          description: All instances
          schema:
            type: array
            items:
              $ref: '#/definitions/Instance'
          headers:
            opc-next-page:
              type: string
              description: A pagination token to the start of the next page, if one exist.
            opc-previous-page:
              type: string
              description: A pagination token to the start of the previous page, if one exists
            opc-total-count:
              type: integer
              description: An approximate total number of resources.
            opc-limit:
              type: integer
              description: The limit that was actually applied to the result page.
        default:
          $ref: '#/responses/Error'
    post:
      tags: ['compute']
      description: Launch a new instance
      operationId: LaunchInstance
      parameters:
        - name: LaunchInstanceRequest
          description: Instance request
          in: body
          schema:
            $ref: '#/definitions/LaunchInstanceRequest'
        - $ref: '#/parameters/IdempotencyToken'
      responses:
        201:
          description: The request was successfully received and the instance is being launched.
          schema:
            $ref: '#/definitions/Instance'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /instances/{instance-id}:
    get:
      tags: ['compute']
      description: Retrieve an instance
      operationId: GetInstance
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
      responses:
        200:
          description: The instance
          schema:
            $ref: '#/definitions/Instance'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    delete:
      tags: ['compute']
      description: Terminate an instance
      operationId: TerminateInstance
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
      responses:
        200:
          description: The request was accepted by the server
        default:
          $ref: '#/responses/Error'

  /instances/{instance-id}/volumeAttachments:
    get:
      tags: ['compute']
      description: List the volume attachments for an instance
      operationId: ListVolumeAttachments
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
        - $ref: '#/parameters/LifecycleStateArrayQueryParam'
      responses:
        200:
          description: A list of all volume attachments for an instance
          schema:
            type: array
            items:
              $ref: '#/definitions/VolumeAttachment'
          headers:
            opc-next-page:
              type: string
              description: A pagination token to the start of the next page, if one exist.
            opc-previous-page:
              type: string
              description: A pagination token to the start of the previous page, if one exists.
            opc-total-count:
              type: integer
              description: An approximate total number of resources.
            opc-limit:
              type: integer
              description: The limit that was actually applied to the result page.
        default:
          $ref: '#/responses/Error'
    post:
      tags: ['compute']
      description: Attach a volume to an instance
      operationId: AttachVolume
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
        - name: AttachVolumeRequest
          description: Attach volume request
          in: body
          schema:
            $ref: '#/definitions/AttachVolumeRequest'
        - $ref: '#/parameters/IdempotencyToken'
      responses:
        201:
          description: The request was successfully received and the volume is being attached.
          schema:
            $ref: '#/definitions/VolumeAttachment'
        default:
          $ref: '#/responses/Error'

  /instanceConsoleHistories/{instance-id}/data:
    get:
      tags: ['compute']
      description: |
        Gets the actual console history data (not the metadata).
        See [CaptureConsoleHistory] (#captureConsoleHistory)
        for details about using the console history operations.
      operationId: ShowConsoleHistoryData
      parameters:
      - $ref: '#/parameters/InstanceIdentifierPathParam'
      - description: Instance id
        format: int32
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Length of snapshot data to retrieve
        format: int32
        in: query
        minimum: 10240
        name: length
        type: integer
      responses:
        200:
          description: Console history data
          headers:
            opc-bytes-remaining:
              description: The number of bytes remaining in the snapshot
              format: int32
              type: integer
            opc-request-id:
              description: Request identifier
              type: string
          schema:
            type: string
        default:
          $ref: '#/responses/Error'
      summary: ShowConsoleHistoryData

  /void-post-with-arg:
    post:
      tags: ['compute']
      description: exercise the void post(arg) generation path
      operationId: VoidPostWithArg
      parameters:
        - name: AttachVolumeRequest
          description: Attach volume request
          in: body
          schema:
            $ref: '#/definitions/AttachVolumeRequest'
      responses:
        201:
          description: It is very dark. You are likely to be eaten by a Void<?>.
        default:
          $ref: '#/responses/Error'

  /void-post-with-no-arg:
    post:
      tags: ['compute']
      description: exercise the void post() generation path
      operationId: VoidPostWithNoArg
      responses:
        201:
          description: "You're walking in the woods. There's no-one around. And your phone is dead. Out of the corner of your eye, you spot him: Void<?>!"
        default:
          $ref: '#/responses/Error'

  /instances/{instance-id}/volumeAttachments/{volume-attachment-id}:
    get:
      tags: ['compute']
      description: Retrieve a volume attachment
      operationId: GetVolumeAttachment
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
        - $ref: '#/parameters/VolumeAttachmentIdentifierPathParam'
      responses:
        200:
          description: A volume attachment
          schema:
            $ref: '#/definitions/VolumeAttachment'
        default:
          $ref: '#/responses/Error'
    delete:
      tags: ['compute']
      description: Detach a volume attachment
      operationId: DetachVolume
      parameters:
        - $ref: '#/parameters/InstanceIdentifierPathParam'
        - $ref: '#/parameters/VolumeAttachmentIdentifierPathParam'
      responses:
        200:
          description: The request was accepted by the server
        default:
          $ref: '#/responses/Error'

  /nonJsonBody/binaryString:
    put:
      tags:
      - "compute"
      operationId: "PutBinaryString"
      consumes:
        - "text/plain"
      produces:
        - "application/octet-stream"
      parameters:
        - name: binaryString
          description: The large binary string
          required: true
          in: body
          schema:
            type: string
            format: binary

      responses:
        201:
          description: It is very dark. You are likely to be eaten by a Void<?>.

  /nonJsonBody/binaryStringWithLargeObject:
    put:
      tags:
      - "compute"
      operationId: "PutLargeBinaryString"
      x-obmcs-large-response-payload: true
      consumes:
        - "application/octet-stream"
      parameters:
        - name: binaryString
          description: The large binary string
          required: true
          in: body
          schema:
            type: string
            format: binary

      responses:
        201:
          description: It is very dark. You are likely to be eaten by a Void<?>.
  /nonJsonReturns/binaryString:
    get:
      tags:
      - "compute"
      operationId: "GetBinaryString"
      produces:
      - "application/octet-stream"
      responses:
        200:
          schema:
            type: string
            format: binary

  /nonJsonReturns/binaryStringWithLargeObject:
    get:
      tags:
      - "compute"
      operationId: "GetBinaryStringWithLargeObject"
      produces:
      - "application/octet-stream"
      x-obmcs-large-response-payload: true
      responses:
        200:
          schema:
            type: string
            format: binary

  /things:
    get:
      tags: ['things']
      description: Test
      operationId: ListThings
      responses:
        200:
          description: The instance
          schema:
            type: array
            items:
              $ref: '#/definitions/Thing'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

    put:
      tags: ['things']
      description: Update a thing
      operationId: UpdateThing
      parameters:
        - name: UpdateThingRequest
          description: Update a thing
          in: body
          schema:
            $ref: '#/definitions/UpdateThingRequest'
      responses:
        201:
          description: The thing was successfully updated.
          schema:
            $ref: '#/definitions/Thing'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /things/empty-body-put:
    put:
      tags: ['things']
      description: Update a thing
      operationId: UpdateThingEmptyInput
      responses:
        201:
          description: The thing was successfully updated.
          schema:
            $ref: '#/definitions/Thing'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /things/empty-body-and-response-put:
    put:
      tags: ['things']
      description: Update a thing
      operationId: UpdateThingEmptyInputAndOutput

  /things/empty-body-post:
    post:
      tags: ['things']
      operationId: createThingWithoutBody
      responses:
        200:
          description: The thing that was created.
          schema:
            $ref: '#/definitions/Thing'

  /things/empty-body-post-without-a-response:
    post:
      tags: ['things']
      operationId: createThingWithoutBodyOrResponse
      responses:
        200:
          description: OK but no response!

  /things/empty-body-patch-without-a-response:
    patch:
      tags: ['things']
      operationId: patchThingWithoutBodyOrResponse
      responses:
        200:
          description: OK but no response!

  /things/empty-body-patch:
    patch:
      tags: ['things']
      operationId: patchThingWithoutBody
      responses:
        200:
          description: The thing that was patched
          schema:
            $ref: '#/definitions/Thing'

  /things/patch-without-a-response:
    patch:
      tags: ['things']
      operationId: patchThingWithoutResponse
      parameters:
        - name: UpdateThingRequest
          description: Update a thing
          in: body
          schema:
            $ref: '#/definitions/UpdateThingRequest'
      responses:
        200:
          description: OK but no response!

  /things/return-array-post:
    post:
      tags: ['things']
      description: post call that returns an array of things
      operationId: ReturnArrayPost
      parameters:
        - name: AttachVolumeRequest
          description: Attach volume request
          in: body
          schema:
            $ref: '#/definitions/AttachVolumeRequest'
      responses:
        '200':
          headers:
            opc-next-page:
              type: string
              description: Pagination token
          description: An array of things
          schema:
            $ref: '#/definitions/ListOfThings'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /items/{id}:
    head:
      tags: ['things']
      description: Terminate an instance
      operationId: getItemHeaderById
      parameters:
        - $ref: '#/parameters/ItemIdPathParam'
      responses:
        200:
          description: The head for the thing without the Thing
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    get:
      tags: ['things']
      description: Terminate an instance
      operationId: getItemById
      produces: multipart/form-data
      consumes: application/json
      parameters:
        - $ref: '#/parameters/ItemIdPathParam'
      responses:
        200:
          description: The Thing
          schema:
            type: file
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    put:
      tags: ['things']
      description: Update a thing
      operationId: putItemById
      consumes: multipart/form-data
      produces: application/json
      parameters:
        - $ref: '#/parameters/ItemIdPathParam'
        - name: file
          in: formData
          description: file to upload
          required: false
          type: file
      responses:
        201:
          description: The thing was successfully updated.
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /things/patch:
    patch:
      tags: ['things']
      operationId: patchThing
      parameters:
        - name: UpdateThingRequest
          description: Update a thing
          in: body
          schema:
            $ref: '#/definitions/UpdateThingRequest'
      responses:
        200:
          description: The thing that was patched
          schema:
            $ref: '#/definitions/Thing'

  /potatoes:
    post:
      tags: ['Potato']
      operationId: AddPotatoes
      parameters:
        - name: PotatoList
          description: The list of potatoes to add.
          in: body
          schema:
            type: array
            items:
              $ref: '#/definitions/Potato'
      responses:
        200:
          description: The list of potatoes that were added.
          schema:
            type: array
            items:
              $ref: '#/definitions/Potato'
  /potatoes/{potato-id}:
    delete:
      tags: ['Potato']
      operationId: DeletePotato
      parameters:
        - $ref: '#/parameters/PotatoIdPathParam'
      responses:
        200:
          schema:
            $ref: '#/definitions/Potato'
  /tomatoes/{tomato-id}:
    get:
      tags: ['Tomato']
      operationId: GetTomato
      parameters:
        - $ref: '#/parameters/TomatoIdPathParam'
      responses:
        200:
          schema:
            $ref: '#/definitions/Tomato'

  /simpleRobots:
    get:
      tags: ['simpleRobot']
      x-obmcs-splat:
        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: ['robots-control-plane-api']
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
      operationId: ListSimpleRobots
      summary: Gets a list of all SimpleRobots in a compartment
      description: |
        Returns a list of SimpleRobots.
      parameters:
        - $ref: '#/parameters/CompartmentIdQueryParam'
        - $ref: '#/parameters/LifecycleStateQueryParam'
        - $ref: '#/parameters/DisplayNameQueryParam'
        - $ref: '#/parameters/SortOrderQueryParam'
        - $ref: '#/parameters/SortByQueryParam'
# It is recommended to use the UDX ticket number as group name to enable/disable the feature.
# The UDX ticket number used here is only an example.
        # Add the new feature that you want to enable/disable here. Similar login applies to methods as well.
        # - $ref: '#/parameters/NewParameterExample'
        - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: A page of SimpleRobotSummary objects.
          schema:
            type: array
            items:
              $ref: '#/definitions/SimpleRobotSummary'
          headers:
            opc-request-id: *ref-opc-request-id
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'

  /fileStorage/{multi-segment-path}:
    get:
      tags: ["fileStorage"]
      operationId: GetFileObject
      parameters:
        - $ref: '#/parameters/MultiSegmentPathParam'
      responses:
        200:
          schema:
            $ref: '#/definitions/FileObject'
    put:
      tags: [ "fileStorage" ]
      operationId: PutFileObject
      parameters:
        - $ref: '#/parameters/MultiSegmentPathParam'
        - name: PutFileObjectRequest
          description: Put a file object
          in: body
          schema:
            $ref: '#/definitions/FileObject'
      responses:
        200:
          description: The file object was saved
          schema:
            $ref: '#/definitions/FileObject'
  /fileStorage/{multi-segment-path}/stats:
    get:
      tags: [ "fileStorage" ]
      operationId: GetFileObjectStats
      parameters:
        - $ref: '#/parameters/MultiSegmentPathParam'
      responses:
        200:
          schema:
            $ref: '#/definitions/FileObjectStats'
  /fileStorage/{single-segment-path}:
    get:
      tags: [ "fileStorage" ]
      operationId: GetRootFileObject
      parameters:
        - $ref: '#/parameters/SingleSegmentPathParam'
      responses:
        200:
          schema:
            $ref: '#/definitions/FileObject'
  /primitiveBody:
    post:
      tags:
        - "primitiveBody"
      operationId: CreateWithPrimitiveBody
      parameters:
        - name: stringBody
          description: Put a string body
          in: body
          schema:
            type: string
      responses:
        201:
          description: The request was successfully received and the instance is being launched.
          schema:
            type: string
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

definitions:
  ProxyFleetSummary:
    type: object
    description: proxy fleet summary object
    properties:
      proxyFleetName:
        type: string
        description: The unique name of the splat proxy fleet.
      compartmentId:
        type: string
        description: The compartment id
      location:
        type: string
        description: the location of the fleet, SUBSTRATE/OVERLAY
        enum: [SUBSTRATE, OVERLAY]
      lifecycleState:
        type: string
        description: the status of the fleet, ACTIVE/DELETED
        enum: [ACTIVE, DELETED]
      services:
        type: array
        description: an array of service names on the fleet
        items:
          type: string

  Tomato:
    properties:
      colors:
        description: The colors found on this tomato.
        items:
          enum:
          - RED
          - GREEN
          - YELLOW
          type: string
        type: array
        maxItems: 3
        minItems: 1
      flavorProfile:
        description: The flavor profile for this tomato.
        items:
          enum:
          - SALTY
          - SPICY
          - SWEET
          - BITTER
          - SOUR
          type: string
        type: array
        maxItems: 5
        minItems: 1

  ResourceSchemaIngestionModifier:
    description: Indicates modifier updating schema for RQS ingestion validation
    type: string
    enum: &RESOURCE_SCHEMA_INGESTION_MODIFIER
      - TAGS_VIA_MAPS
      - IDENTIFIER_AS_ID
      - TAGS_VIA_TAG_SLUG

  ResourceSchema:
    description: The object that represents schema for a particular resource type and version
    type: object
    required:
      - id
    properties:
      id:
        description: This is unique id to identify the resource schema.
        type: string
      ingestionModifiers:
        description: The ingestion modifiers to apply to this schema.
        type: array
        items:
          type: string
          x-obmcs-top-level-enum: '#/definitions/ResourceSchemaIngestionModifier'
          enum: *RESOURCE_SCHEMA_INGESTION_MODIFIER

  Potato:
    properties:
      name:
        type: string
        description: The type of potato.

  Thing:
    required:
      - id
    properties:
      id:
        type: string
      with_underscore:
        type: string

  ListOfThings:
    properties:
      Things:
        type: array
        items:
          $ref: '#/definitions/Thing'

  SinglePropertyThatIsTheDiscriminatorThing:
    required:
      - type
    discriminator: type
    properties:
      type:
        type: string

  ChildThingOfTheThingAbove:
    allOf:
      - $ref: '#/definitions/SinglePropertyThatIsTheDiscriminatorThing'
      - discriminator: childthing
        properties:
          childProperty:
            type: string

  SecondChildOfTheThingAbove:
    allOf:
      - $ref: '#/definitions/SinglePropertyThatIsTheDiscriminatorThing'
      - discriminator: secondchildthing
        properties:
          secondChildProperty:
            type: string

  Region:
    required:
      - id
      - endpoint
      - description
    properties:
      id:
        type: string
      endpoint:
        type: string
        format: url
      description:
        type: string

  AvailabilityDomain:
    required:
      - id
    properties:
      id:
        type: string

  Instance:
    required:
      - id
      - shape
      - region
      - domain
      - state
    properties:
      id:
        type: string
        description: A UUID that uniquely identifies an instance
        minLength: 37
        maxLength: 37
      shape:
        type: string
        description: The shape of an instance
        minLength: 1
        maxLength: 255
      region:
        type: string
        description: A region identifier
        minLength: 1
        maxLength: 255
      domain:
        type: string
        description: The availability domain of an instance
        minLength: 1
        maxLength: 255
      state:
        type: string
        description: The current state of the instance
        enum:
          - provisioning
          - running
          - shutting-down
          - terminated

  LaunchInstanceRequest:
    required:
      - shape
      - domain
      - vcn
      - subnet
    properties:
      shape:
        type: string
        description: The shape of an instance
        minLength: 1
        maxLength: 255
      domain:
        type: string
        description: The availability domain of an instance
        minLength: 1
        maxLength: 255
      vcn:
        type: string
        description: A virtual cloud network identifier
        minLength: 37
        maxLength: 37
      subnet:
        type: string
        description: A virtual cloud subnet identifier
        minLength: 37
        maxLength: 37

  UpdateThingRequest:
    required:
      - thingid
    properties:
      thingid:
        type: string
        description: The thing's ID
        minLength: 1
        maxLength: 255
      another-thing-with-dashes:
        type: string

  VolumeAttachment:
    description: |
      Represents an attachment between a block storage volume and a compute instance.

      This is the base type for polymorphic volume types.
    discriminator: type
    required:
      - id
      - type
      - instanceId
      - volumeId
      - state
    properties:
      id:
        type: string
        description: The volume attachment identifier
        minLength: 37
        maxLength: 37
      type:
        type: string
        description: The type of volume attachment
        minLength: 1
        maxLength: 255
      instanceId:
        type: string
        description: The instance identifier
        minLength: 37
        maxLength: 37
      volumeId:
        type: string
        description: The identifier of the volume
        minLength: 1
        maxLength: 255
      state:
        type: string
        description: The current state of the volume attachment
        enum:
          - attaching
          - attached
          - attach-failed
          - detaching
          - detached
          - detach-failed

  IScsiVolumeAttachment:
    description: An ISCSI volume attachment
    allOf:
      - $ref: '#/definitions/VolumeAttachment'
      - # This defines this volume attachment's "type" as "iscsi".
        discriminator: iscsi
        required:
          - iqn
          - ipv4
          - port
        properties:
          iqn:
            type: string
            minLength: 1
          ipv4:
            type: string
            minLength: 15
            maxLength: 15
          port:
            type: integer
            minimum: 1
            maximum: 2147483648 # MaxInt + 1

  AttachVolumeRequest:
    discriminator: type
    required:
      - volumeId
    properties:
      type:
        type: string
      volumeId:
        type: string
        description: |
          The identifier of the volume.
          Second line of volume request description.
        minLength: 1
        maxLength: 255

  AttachIScsiVolumeRequest:
    allOf:
      - $ref: '#/definitions/AttachVolumeRequest'
      - discriminator: iscsi

  ParentWithDefault:
    discriminator: childType
    properties:
      childType:
       type: string
       default: 'TypeA'

  ChildTypeA:
    allOf:
    - $ref: '#/definitions/ParentWithDefault'
    - discriminator: 'TypeA'
      properties:
        childAField:
          type: string

  ChildTypeB:
    allOf:
    - $ref: '#/definitions/ParentWithDefault'
    - discriminator: 'TypeB'
      properties:
        childBField:
          type: string

  Error:
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string

  EmptyThing:
    type: object

  LifecycleStates:
    type: string
    description: Possible lifecycle states.
    enum: &LIFECYCLESTATES
      - CREATING
      - UPDATING
      - ACTIVE
      - DELETING
      - DELETED
      - FAILED

  SortOrders:
    type: string
    description: Sort orders.
    enum: &SORTORDERS
      - ASC
      - DESC

  SimpleRobotSummary:
    description: Summary of the SimpleRobot.
    type: object
    required:
      - id
      - compartmentId
      - simpleRobotType
    properties:
      id:
        description: Unique identifier that is immutable on creation
        type: string
      displayName:
        description: SimpleRobot Identifier, can be renamed
        type: string
      compartmentId:
        description: Compartment Identifier
        type: string
      simpleRobotType:
        description: Type of the SimpleRobot.
        type: string
      timeCreated:
        description: The time the the SimpleRobot was created. An RFC3339 formatted datetime string
        type: string
        format: date-time
      timeUpdated:
        description: The time the SimpleRobot was updated. An RFC3339 formatted datetime string
        type: string
        format: date-time
      lifecycleState:
        description: The current state of the SimpleRobot.
        type: string
        x-obmcs-top-level-enum: '#/definitions/LifecycleStates'
        enum: *LIFECYCLESTATES
      lifecycleDetails:
        description: A message describing the current state in more detail. For example, can be used to provide actionable information for a resource in Failed state.
        type: string

  FileObject:
    properties:
      fileId:
        type: string
        description: File Id.
      fileName:
        type: string
        description: File name.
      extension:
        type: string
        description: File extension.

  FileObjectStats:
    properties:
      fileId:
        type: string
        description: File Id.
      fileName:
        type: string
        description: File name.
      downloadCount:
        type: integer
        format: int32
        description: Download count.


parameters:
  OpcRequestIdHeader:
    name: opc-request-id
    in: header
    description: Unique Oracle-assigned identifier for the request.
    type: string
  ValidMinLength:
    name: validMin
    type: integer
    in: query
    description: |
      Foobar
    minimum: 1
  ValidMaxLength:
    name: validMax
    type: integer
    format: int64
    in: query
    description: |
      Foobar
    maximum: 2147483648 # MaxInt + 1
  InstanceIdentifierPathParam:
    name: instance-id
    in: path
    type: string
    description: The instance's identifier
    minLength: 37
    maxLength: 37
    pattern: "^[a-zA-Z0-9_-]+$"
  VolumeAttachmentIdentifierPathParam:
    name: volume-attachment-id
    in: path
    type: string
    description: The volume attachment identifier
    minLength: 37
    maxLength: 37
  IdempotencyToken:
    name: opc-idempotency-token
    type: string
    in: header
    description: A user-supplied token that uniquely identifies a request. A single request will be acted upon among many requests that share the same token. Idempotency tokens expire after 30 minutes.
    minLength: 1
    maxLength: 64
  ItemIdPathParam:
    name: id
    in: path
    type: string
    description: The identifier
    minLength: 1
    maxLength: 255
  PotatoIdPathParam:
    name: potato-id
    in: path
    type: string
  TomatoIdPathParam:
    name: tomato-id
    in: path
    type: string
  CompartmentIdQueryParam:
    name: compartmentId
    in: query
    required: true
    type: string
    description: The ID of the compartment in which to list resources.
  LifecycleStateQueryParam:
    name: lifecycleState
    in: query
    required: false
    type: string
    x-obmcs-top-level-enum: '#/definitions/LifecycleStates'
    enum: *LIFECYCLESTATES
    x-default-description: 'null'
    description: A filter to return only resources their lifecycleState matches the given lifecycleState.
  LifecycleStateArrayQueryParam:
    name: lifecycleState
    in: query
    type: array
    required: false
    items:
      type: string
      x-obmcs-top-level-enum: '#/definitions/LifecycleStates'
      enum: *LIFECYCLESTATES
    x-default-description: 'null'
    description: A filter to return only resources their lifecycleState matches the given lifecycleState.
  DisplayNameQueryParam:
    in: query
    maxLength: 255
    minLength: 1
    name: displayName
    type: string
    pattern: "^[a-zA-Z_][a-zA-Z_0-9]*$"
    x-obmcs-pattern-description: Must start with an alphabetic character (case insensitive) or underscore.  May only include alphabetic characters, numbers and underscores.  No spaces or special characters.
    x-default-description: 'null'
    description: A filter to return only resources that match the entire display name given.
  SortOrderQueryParam:
    name: sortOrder
    in: query
    type: string
    x-obmcs-top-level-enum: '#/definitions/SortOrders'
    enum: *SORTORDERS
    default: 'ASC'
    description: The sort order to use, either 'asc' or 'desc'.
  SortByQueryParam:
    name: sortBy
    in: query
    type: string
    enum:
      - timeCreated
      - displayName
    default: 'timeCreated'
    description: |
      The field to sort by. Only one sort order may be provided. Default order for timeCreated is descending. Default order for displayName is ascending. If no value is specified timeCreated is default.
  MultiSegmentPathParam:
    name: multi-segment-path
    in: path
    type: string
    description: A multi-segment path parameter.
    x-capture-pattern: .*
  SingleSegmentPathParam:
    name: single-segment-path
    in: path
    type: string
    description: A single-segment path parameter.

